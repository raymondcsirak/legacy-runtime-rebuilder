name: Test CLI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python3 -m unittest discover -s tests -v
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [centos7, ubuntu18]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f tests/Dockerfile.${{ matrix.target }} -t native-test .
      - run: docker run --rm --user 0 native-test sh tests/install-check.sh
